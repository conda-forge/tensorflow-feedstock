  primary_key: cuda_compiler_version
  ordering:
    cuda_compiler_version:
      - 12.4
      - 12.6
      - 12.9
      - None
      - 12.8
      - 13.4
      - 13.0
      # to allow manual opt-in for CUDA 11.8, see
