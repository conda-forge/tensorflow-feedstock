# TF 2.21.0 / XLA require clang on linux (xla/codegen/intrinsic cc_to_llvm_ir
# emits LLVM bitcode via -emit-llvm). Build the feedstock with conda-forge
# clang, matching TensorFlow upstream. clangxx_linux-64 still targets libstdc++
# so the conda ABI is unchanged.
#
# Pin to 22, not 18: TF 2.21.0's third_party/xla/third_party/llvm/workspace.bzl
# pins LLVM commit 909041e4802c4b9a2223ca04099f35bf1dbbd460 (2026-01-27), which
# sits essentially at the llvmorg-22.1.0 branch point (released 2026-02-24) --
# roughly four LLVM major versions and ~22 months past llvmorg-18.1.0
# (2024-03-06). clang 22 keeps the compiler in the same LLVM era as the
# MLIR/XLA sources it builds and is what enables clang-as-CUDA-compiler for
# CUDA 12.9/13.0 (see build_common.sh: nvcc's EDG host frontend cannot parse
# clang-22-era absl/protobuf/clang-resource headers, and clang 18 could not
# compile CUDA 13 device code).
# Historical note: this bump was first motivated by a runtime crash in every
# GPU JIT path ("'llvm.mlir.constant' op attribute and type have different
# float semantics"), but that crash was ultimately root-caused to duplicated
# MLIR across the wheel's shared objects and fixed by the
# libtensorflow_framework symlink in build_pkg.sh (see the comment there);
# the clang 22 pin is kept as correct upstream alignment, not as that
# crash's fix.
#
# c_compiler_version / cxx_compiler_version / c_stdlib_version are in the
# conda-forge `unix` zip_keys group; under CF_CUDA_ENABLED the cuda migrator
# adds a second entry (the CUDA variant), so every overridden linux key must
# carry TWO parallel entries to keep the zip group consistent (mirrors how
# jaxlib-feedstock pins clang alongside its CUDA variants). The migrator
# overrides element 1's *_compiler_version for the CUDA build; c_compiler
# stays clang, so the CUDA variant builds with clang at the migrator's version.
c_compiler:                     # [linux]
  - clang                       # [linux]
  - clang                       # [linux]
  - clang                       # [linux]
cxx_compiler:                   # [linux]
  - clangxx                     # [linux]
  - clangxx                     # [linux]
  - clangxx                     # [linux]
c_compiler_version:             # [linux]
  - 22                          # [linux]
  - 22                          # [linux]
  - 22                          # [linux]
cxx_compiler_version:           # [linux]
  - 22                          # [linux]
  - 22                          # [linux]
  - 22                          # [linux]
c_stdlib_version:               # [linux]
  - 2.17                        # [linux]
  - 2.17                        # [linux]
  - 2.28                        # [linux]

github_actions_labels:          # [unix]
- namespace-profile-16cpu-on-linux-64       # [linux64]
- namespace-profile-16cpu-on-linux-64       # [linux and aarch64]
- namespace-profile-12cpu-on-osx-arm64      # [osx]
microarch_level:
- 1
# hmaarrfk -- temporary, uncomment during actual build
- 3   # [linux and x86_64]
- 4   # [linux and x86_64]

libabseil:
- '20260107'
libgrpc:
- '1.78'
libprotobuf:
- 6.33.5
